[package]
name = "dwgconv"
version = "0.1.0"
edition = "2021"
description = "Conversor DXF→DWG de FácilTrazo (acadrust compilado a WebAssembly)"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
acadrust = { version = "0.6.8", default-features = false }
wasm-bindgen = "0.2"

[profile.release]
opt-level = "s"
lto = true
